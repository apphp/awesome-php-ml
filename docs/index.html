const grid = document.getElementById('grid');
const search = document.getElementById('search');
const category = document.getElementById('category');
const legend = document.getElementById('legend');
const sort = document.getElementById('sort');
const empty = document.getElementById('empty');

document.getElementById('total').textContent = items.length;

const categories = [...new Set(items.map(i => i.category))].sort();
document.getElementById('categories').textContent = categories.length;

categories.forEach(cat => {
  const opt = document.createElement('option');
  opt.value = cat;
  opt.textContent = cat;
  category.appendChild(opt);
});

function render() {
  const q = search.value.toLowerCase();
  const cat = category.value;
  const selectedLegend = legend.value;

  let filtered = items.filter(item => {
    const haystack = [
      item.name,
      item.description,
      item.category
    ].join(' ').toLowerCase();

    return haystack.includes(q)
      && (!cat || item.category === cat)
      && (!selectedLegend || item.badge === selectedLegend);
  });

  filtered.sort((a, b) => {
    if (sort.value === 'category') {
      return a.category.localeCompare(b.category) || a.name.localeCompare(b.name);
    }
    return a.name.localeCompare(b.name);
  });

  const starsFormatter = new Intl.NumberFormat('en-US');

  grid.innerHTML = filtered.map(item => `
    <article class="card">
      <h2>
        <span class="badge">${item.badge || ''}</span>
        <a href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.name)}</a>
      </h2>
      <p class="desc">${escapeHtml(item.description)}</p>
      <div class="meta">
        <span class="tag">${escapeHtml(item.category)}</span>
        <span class="tag">⭐ ${item.stars !== null ? starsFormatter.format(item.stars) : 'N/A'}</span>
      </div>
    </article>
  `).join('');

  empty.style.display = filtered.length ? 'none' : 'block';
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  }[s]));
}

search.addEventListener('input', render);
category.addEventListener('change', render);
legend.addEventListener('change', render);
sort.addEventListener('change', render);

render();
</script>
