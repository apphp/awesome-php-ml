
name: Link Check

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show resources count diff (PR)
        if: github.event_name == 'pull_request'
        run: |
          cat > resources-diff.php <<'PHP'
          <?php
          $readme = file_get_contents('README.md');
          preg_match_all('~\s+"Link to resource"~', $readme, $matches);
          $new = (string) count($matches[0]);

          $badge = json_decode(file_get_contents('badge/resources.json'), true);
          $old = (string) (($badge['message'] ?? ''));

          echo "OLD=$old\n";
          echo "NEW=$new\n";
          PHP

          php resources-diff.php | tee resources-diff.txt
          OLD="$(grep '^OLD=' resources-diff.txt | cut -d= -f2- | tr -d '\r' | tr -d '\n')"
          NEW="$(grep '^NEW=' resources-diff.txt | cut -d= -f2- | tr -d '\r' | tr -d '\n')"
          echo "Resources badge: $OLD -> $NEW" >> "$GITHUB_STEP_SUMMARY"
      - name: Update resources badge
        if: github.event_name != 'pull_request'
        run: |
          cat > update-badge.php <<'PHP'
          <?php
          $readme = file_get_contents('README.md');
          preg_match_all('~\s+"Link to resource"~', $readme, $matches);
          $count = (string) count($matches[0]);

          $badgePath = 'badge/resources.json';
          $badge = json_decode(file_get_contents($badgePath), true);
          if (!is_array($badge)) {
              $badge = [];
          }
          $badge['schemaVersion'] = $badge['schemaVersion'] ?? 1;
          $badge['label'] = $badge['label'] ?? 'resources';
          $badge['message'] = $count;
          $badge['color'] = $badge['color'] ?? 'blue';
          file_put_contents($badgePath, json_encode($badge, JSON_UNESCAPED_SLASHES) . "\n");
          PHP
          php update-badge.php

          if git diff --quiet -- badge/resources.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badge/resources.json
          git commit -m "chore: update resources badge"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Check links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress --exclude-mail --accept 200,429 README.md
