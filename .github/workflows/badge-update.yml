
name: Badge Update

# Run after merges (push to main) and allow manual runs
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required to commit and push updated badge/resources.json
permissions:
  contents: write

# Prevent overlapping runs on the same ref (avoids push races)
concurrency:
  group: badge-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  badge-update:
    runs-on: ubuntu-latest
    steps:
      # Checkout full history so we can reset/rebase and push safely
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compute count ("Link to resource" marker) and update badge/resources.json,
      # then commit + push the change back to main
      - name: Update resources badge
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

          cat > update-badge.php <<'PHP'
          <?php
          $readme = file_get_contents('README.md');
          preg_match_all('~\s+"Link to resource"~', $readme, $matches);
          $count = (string) count($matches[0]);

          $badgePath = 'badge/resources.json';
          $badge = json_decode(file_get_contents($badgePath), true);
          if (!is_array($badge)) {
              $badge = [];
          }
          $badge['schemaVersion'] = $badge['schemaVersion'] ?? 1;
          $badge['label'] = $badge['label'] ?? 'resources';
          $badge['message'] = $count;
          $badge['color'] = $badge['color'] ?? 'blue';
          file_put_contents($badgePath, json_encode($badge, JSON_UNESCAPED_SLASHES) . "\n");
          PHP

          php update-badge.php

          if git diff --quiet -- badge/resources.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badge/resources.json
          git commit -m "chore: update resources badge"

          # Rebase/retry to tolerate main advancing while this job runs
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 2
          done

          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push --force-with-lease origin "HEAD:$GITHUB_REF_NAME"
