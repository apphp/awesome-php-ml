name: Resource Count Badge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update resource count badge JSON
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(grep -E '^\- .*\[[^]]+\]\(https?://[^)]+\)' README.md \
            | grep -Ev '\\(https?://(img\\.shields\\.io|awesome\\.re)/' \
            | grep -Ev '/badge\\.svg(\)|\?)' \
            | wc -l \
            | tr -d ' ')
          mkdir -p badge
          printf '{"schemaVersion":1,"label":"resources","message":"%s","color":"blue"}\n' "$COUNT" > badge/resources.json

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update resources badge"
          file_pattern: "badge/resources.json"
